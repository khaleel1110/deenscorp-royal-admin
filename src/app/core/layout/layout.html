<!-- layout.html -->
<ng-progress id="progress-main" color="#448c74"></ng-progress>
<app-toast-notification></app-toast-notification>

<div [ngClass]="showAside?'has-navbar-vertical-aside navbar-vertical-aside-show-xl ':'navbar-vertical-aside-mini-mode'" class="">

  <!-- ========== HEADER ========== -->
  <header id="header" style="background-color: #ffffff"
          class="navbar navbar-expand-lg navbar-fixed navbar-height navbar-container navbar-bordered">
    <div class="navbar-nav-wrap">
      <a class="me-3" routerLink="/" aria-label="Front">
        <img class="" src="/DCR_1.svg" height="45" alt="Logo">
      </a>
      <!-- End Logo -->

      <div class="navbar-nav-wrap-content-start">
        <ul class="navbar-nav">
          <li class="nav-item d-none d-lg-block">
            <div>
              <button (click)="PreviousRoute()" class="btn btn-soft-primary btn-sm">
                <i class="bi bi-arrow-left"></i> Back
              </button>
            </div>
          </li>
        </ul>
      </div>

      <div class="navbar-nav-wrap-content-end">
        <!-- Navbar -->
        <ul class="navbar-nav">
          <li class="nav-item">
            <yex-user-profile></yex-user-profile>
          </li>
    <!--      <li class="nav-item d-none d-sm-inline-block">
            <gms-app-switcher></gms-app-switcher>
          </li>
          <li class="nav-item d-none d-sm-inline-block">
            <button routerLink="/org/org-settings" type="button"
                    class="btn btn-ghost-secondary btn-icon rounded-circle"
                    id="navbarNotificationsDropdown"
                    data-bs-toggle="dropdown" aria-expanded="false"
                    data-bs-auto-close="outside" data-bs-dropdown-animation>
              <img src="/polaris-icons/SettingsMajor.svg" style="height: 1.82rem"/>
            </button>
          </li>-->
          <li class="nav-item d-xl-none d-inline-block">
           <!-- <yex-menu [mainNavigation]="mainNavigationList"></yex-menu>-->
          </li>
        </ul>
        <!-- End Navbar -->
      </div>
    </div>
  </header>

  <!-- Navbar Vertical -->
  <aside style="background-color: #F6F6F7"
         class="border-end js-navbar-vertical-aside navbar navbar-vertical-aside navbar-vertical navbar-vertical-fixed navbar-expand-xl">
    <div class="navbar-vertical-container">
      <div class="navbar-vertical-footer-offset">

        <!-- Logo -->
        <a class="m-2 py-4" routerLink="/" aria-label="Front">
          @if(showAside){
            <img class="mt-3 ms-2" src="/DCR_1.svg"  height="70" alt="Logo">
          } @else {
            <img class="mt-3 ms-2" src="/DCR_1.svg"  height="18" alt="Logo">
          }
        </a>
        <!-- End Logo -->

        <!-- Navbar Vertical Toggle -->
        <button type="button" (click)="toggleAside()"
                class="d-none d-xl-block js-navbar-vertical-aside-toggle-invoker btn btn-icon btn-white rounded-circle"
                style="position: absolute; right: -1.5rem; top:1rem">
          <i class="bi-arrow-bar-left navbar-toggler-short-align"
             data-bs-template='<div class="tooltip d-none d-md-block" role="tooltip"><div class="arrow"></div><div class="tooltip-inner"></div></div>'
             data-bs-toggle="tooltip" data-bs-placement="right" title="Collapse"></i>
          <i class="bi-arrow-bar-right navbar-toggler-full-align"
             data-bs-template='<div class="tooltip d-none d-md-block" role="tooltip"><div class="arrow"></div><div class="tooltip-inner"></div></div>'
             data-bs-toggle="tooltip" data-bs-placement="right" title="Expand"></i>
        </button>
        <!-- End Navbar Vertical Toggle -->

        <!-- Side Navigation Content -->
        <yex-side-navigation [showAside]="showAside"
                             [mainNavigation]="mainNavigationList"
                             [subNavigationList]="subNavigationList"
                             [subNavigationTitle]="'More'">
        </yex-side-navigation>

      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div style="background-color: #fbfbfb; min-height: 92vh; padding-top: 5rem" class="pb-5">
    <router-outlet></router-outlet>
  </div>

</div>
