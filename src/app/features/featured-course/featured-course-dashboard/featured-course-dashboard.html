<main id="content" role="main" class="main">
  <div class="container">

    <!-- Stats Row -->
    <div class="row">
      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">
        <app-dashboard-stat
          label="Total Featured"
          [value]="totalFeatured | number"
          icon="bi-star"
          tone="primary"
        />
      </div>
      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">
        <app-dashboard-stat
          label="Active on Site"
          [value]="activeFeatured"
          icon="bi-eye"
          tone="success"
        />
      </div>
      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">
        <app-dashboard-stat
          label="Average Rating"
          [value]="avgRating"
          icon="bi-star-fill"
          tone="warning"
        />
      </div>
      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">
        <app-dashboard-stat
          label="Total Reviews"
          [value]="totalReviews | number"
          icon="bi-chat-square-text"
          tone="purple"
        />
      </div>
    </div>

    <!-- Chart Row -->
    <div class="row">
      <div class="col-12 mb-3 mb-lg-5">
        <div class="card h-100">
          <div class="card-header">
            <h4 class="card-header-title">Top Rated Featured Courses</h4>
          </div>
          <div class="card-body">
            @if (!loading && barLabels.length) {
              <app-grouped-bar-chart
                [labels]="barLabels"
                [datasets]="barDatasets"
                [height]="260"
                [currency]="false"
                ariaLabel="Rating per featured course"
              />
            } @else if (!loading) {
              <p class="text-muted text-center py-5 mb-0">No featured courses yet.</p>
            }
          </div>
        </div>
      </div>
    </div>

  </div>
</main>
