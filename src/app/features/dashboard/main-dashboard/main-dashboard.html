<main
  id="content"
  role="main"
  class="main"
>

  <div class="container">

    <!-- ============================= -->
    <!-- STATISTICS -->
    <!-- ============================= -->

    <div class="row">

      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">

        <app-dashboard-stat
          label="Total Courses"
          value="72,540"
          icon="bi-book"
          tone="primary"
          trend="12.5%"
          helper="from 70,104"
        />

      </div>


      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">

        <app-dashboard-stat
          label="Sessions"
          value="29.4%"
          icon="bi-people"
          tone="success"
          trend="1.7%"
          helper="from 29.1%"
        />

      </div>


      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">

        <app-dashboard-stat
          label="Training Centers"
          value="56.8%"
          icon="bi-building"
          tone="warning"
          trend="4.4%"
          [trendDown]="true"
          helper="from 61.2%"
        />

      </div>


      <div class="col-sm-6 col-lg-3 mb-3 mb-lg-5">

        <app-dashboard-stat
          label="Pageviews"
          value="92,913"
          icon="bi-eye"
          tone="purple"
          trend="0.0%"
          helper="from 2,913"
        />

      </div>

    </div>


    <!-- ============================= -->
    <!-- CHARTS -->
    <!-- ============================= -->

    <div class="row">

      <!-- Pie Chart -->

      <div class="col-lg-6 mb-3 mb-lg-5">

        <app-pie-chart-dashboard />

      </div>


      <!-- Grouped Bar Chart -->

      <div class="col-lg-6 mb-3 mb-lg-5">

        <div class="card h-100">

          <div class="card-header">

            <h4 class="card-header-title">
              Fees collection summary
            </h4>

          </div>


          <div class="card-body">

            <div class="d-flex gap-3 small-muted mb-3">

              <span>
                <i class="bi bi-square-fill text-success me-1"></i>
                Management
              </span>

              <span>
                <i class="bi bi-square-fill text-primary me-1"></i>
                Inspection
              </span>

            </div>


            <app-grouped-bar-chart
              [labels]="feeCollectionLabels"
              [datasets]="feeCollectionDatasets"
              [height]="230"
              ariaLabel="Fees collection summary"
            />

          </div>

        </div>

      </div>



    </div>
    <div class="row">

      <div class="col-lg-8 mb-3 mb-lg-5">

        <app-course-performance
          [items]="coursePerformance"
          title="Course performance"
          viewAllText="View all"
        />

      </div>


      <!-- Course Categories -->

      <div class="col-lg-4 mb-3 mb-lg-5">

        <div class="card h-100">

          <div class="card-header">

            <h4 class="card-header-title">
              Course categories
            </h4>

          </div>


          <div class="card-body">

            <div class="d-flex justify-content-between mb-3">

              <span>
                Technology
              </span>

              <strong>
                42%
              </strong>

            </div>


            <div class="d-flex justify-content-between mb-3">

              <span>
                Business
              </span>

              <strong>
                26%
              </strong>

            </div>


            <div class="d-flex justify-content-between mb-3">

              <span>
                Agriculture
              </span>

              <strong>
                18%
              </strong>

            </div>


            <div class="d-flex justify-content-between">

              <span>
                Other
              </span>

              <strong>
                14%
              </strong>

            </div>

          </div>

        </div>

      </div>

    </div>


      <app-page-footer />

  </div>



</main>
